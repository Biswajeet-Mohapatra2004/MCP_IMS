services:
  keycloak:
    image: quay.io/keycloak/keycloak:latest
    container_name: ims-keycloak
    command: start-dev
    environment:
        KEYCLOAK_ADMIN: admin
        KEYCLOAK_ADMIN_PASSWORD: admin
        KC_HEALTH_ENABLED: "true"
    ports:
      - "8180:8080"
    healthcheck:
      test: [ "CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8080 && echo -e 'GET /health/ready HTTP/1.1\r\nhost: localhost\r\n\r\n' >&3 && cat <&3 | grep -q '\"status\": \"UP\"'" ]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 30s

  postgres:
    image: postgres:16
    container_name: ims-postgres
    environment:
      POSTGRES_DB: ims_db
      POSTGRES_USER: ims_user
      POSTGRES_PASSWORD: ims_pass
    ports:
      - "5432:5432"
    volumes:
      - ims_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ims_user -d ims_db" ]
      interval: 5s
      timeout: 5s
      retries: 5
volumes:
  ims_pg_data:
