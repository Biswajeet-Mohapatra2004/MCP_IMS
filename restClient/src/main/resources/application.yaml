spring:
  application:
    name: restClient
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8080/realms/ims-realm}

  docker:
    compose:
      lifecycle-management: start-only

  datasource:
    url: ${NEON_DB_URL:jdbc:postgresql://localhost:5432/ims_db}
    username: ${NEON_DB_USERNAME:ims_user}
    password: ${NEON_DB_PASSWORD:ims_pass}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

server:
    port: ${PORT:8081}

app:
  cors:
    allowed-origin: ${FRONTEND_ORIGIN:http://localhost:5173}

logging:
  level:
    root: INFO
    org.springframework.security: DEBUG   # helpful while wiring up OAuth2 — turn down once it's stable
    org.hibernate.SQL: DEBUG